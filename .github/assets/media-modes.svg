  </g>
  <path d="M168 221v29h864v-29 M456 221v29 M744 221v29 M600 250v24" fill="none" stroke="#8563b2" stroke-width="3"/>
  <rect x="348" y="274" width="504" height="52" rx="26" fill="#302242"/>
  <text x="600" y="308" fill="#f0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="650" text-anchor="middle">Saved libraries and progress on device</text>
