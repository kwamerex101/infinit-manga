  <rect width="1200" height="350" rx="24" fill="#14121b"/>
  <g fill="#211b2c" stroke="#48365a" stroke-width="2">
    <rect x="36" y="40" width="264" height="180" rx="16"/>
    <rect x="324" y="40" width="264" height="180" rx="16"/>
    <rect x="612" y="40" width="264" height="180" rx="16"/>
    <rect x="900" y="40" width="264" height="180" rx="16"/>
  </g>
  <g fill="none" stroke="#c4a3fd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 77h48v51h-48z M151 89h14v13h-14z M171 89h14 M171 96h14 M151 114h34"/>
    <path d="M432 82h12c8 0 12 4 12 9v39c0-5-4-9-12-9h-12z M480 82h-12c-8 0-12 4-12 9v39c0-5 4-9 12-9h12z"/>
